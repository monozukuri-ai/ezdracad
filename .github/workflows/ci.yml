name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p ezdracad-core --locked
      - run: cargo build --workspace --locked
      - run: cargo package -p ezdracad-core --locked
      - run: cargo doc -p ezdracad-core --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: cargo check --workspace --locked

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed with synthetic layouts
        run: |
          mkdir -p fuzz/corpus/scan_mpz fuzz/corpus/scan_contents
          cp tests/fixtures/records*.cfb fuzz/corpus/scan_mpz/
          cp tests/fixtures/records*.bin fuzz/corpus/scan_contents/
          cp tests/fixtures/blocks*.cfb fuzz/corpus/scan_mpz/
          cp tests/fixtures/blocks*.bin fuzz/corpus/scan_contents/
          cp tests/fixtures/objects*.cfb fuzz/corpus/scan_mpz/
          cp tests/fixtures/objects*.bin fuzz/corpus/scan_contents/
          cp tests/fixtures/semantics*.cfb fuzz/corpus/scan_mpz/
          cp tests/fixtures/semantics*.bin fuzz/corpus/scan_contents/
          cp tests/fixtures/measurement*.cfb tests/fixtures/inheritance*.cfb fuzz/corpus/scan_mpz/
          cp tests/fixtures/measurement*.bin tests/fixtures/inheritance*.bin fuzz/corpus/scan_contents/
          mkdir -p fuzz/corpus/read_mps
          cp tests/fixtures/mps-*.mps fuzz/corpus/read_mps/
          mkdir -p fuzz/corpus/read_mpx
          cp tests/fixtures/mpx*.mpx fuzz/corpus/read_mpx/
          mkdir -p fuzz/corpus/read_basic2d
          cp tests/fixtures/basic2d25.cfb fuzz/corpus/read_basic2d/
          mkdir -p fuzz/corpus/read_document
          cp tests/fixtures/document*.cfb tests/fixtures/blocks25.cfb tests/fixtures/semantics25.cfb fuzz/corpus/read_document/
      - run: cargo fuzz run scan_contents -- -runs=1000 -max_len=131072 -timeout=5 -rss_limit_mb=1024
      - run: cargo fuzz run scan_mpz -- -runs=1000 -max_len=262144 -timeout=5 -rss_limit_mb=1024
      - run: cargo fuzz run read_document -- -runs=1000 -max_len=262144 -timeout=5 -rss_limit_mb=1024
      - run: cargo fuzz run read_basic2d -- -runs=1000 -max_len=262144 -timeout=5 -rss_limit_mb=1024
      - run: cargo fuzz run read_mps -- -runs=1000 -max_len=262144 -timeout=5 -rss_limit_mb=1024
      - run: cargo fuzz run read_mpx -- -runs=1000 -max_len=262144 -timeout=5 -rss_limit_mb=1024

  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin develop --release --locked
      - run: uv run --no-sync python scripts/bump_version.py --check
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/check_public_surface.py
      - run: uv run --no-sync python scripts/build_distributions.py --out dist
      - name: Verify clean wheel install
        shell: bash
        run: uv run --no-sync python scripts/verify_distribution.py dist/*.whl
      - name: Build and verify sdist
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.10'
        shell: bash
        run: |
          uv run --no-sync maturin sdist --out dist
          uv run --no-sync python scripts/verify_distribution.py dist/*.tar.gz
