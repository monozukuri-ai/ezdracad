name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty to validate only)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and release tag
    runs-on: ubuntu-24.04
    outputs:
      maturin-version: ${{ steps.tools.outputs.maturin-version }}
      source-sha: ${{ steps.tools.outputs.source-sha }}
      release-tag: ${{ steps.tools.outputs.release-tag }}
      prerelease: ${{ steps.tools.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - name: Check versions and locks
        shell: bash
        run: |
          uv run --no-sync python scripts/bump_version.py --check
          uv run --no-sync python scripts/check_public_surface.py
      - name: Validate release identity and read the locked build tool version
        id: tools
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from bump_version import ROOT, check_versions, python_version
          from packaging.version import Version

          # Keep tag validation in the workflow so fixes can qualify older tags.
          rust_version = check_versions(ROOT)
          package_version = python_version(rust_version)
          tag = os.environ["RELEASE_TAG"]
          if tag and tag not in {f"v{rust_version}", f"v{package_version}"}:
              raise SystemExit(f"Tag {tag!r} does not match {rust_version} / {package_version}")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          version = next(p["version"] for p in lock["package"] if p["name"] == "maturin")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"maturin-version=v{version}\n")
              output.write(f"source-sha={sha}\n")
              output.write(f"release-tag={tag}\n")
              output.write(f"prerelease={str(Version(package_version).is_prerelease).lower()}\n")
          PY

  quality:
    name: Run the complete CI suite
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.source-sha }}

  wheels:
    name: Build and verify ${{ matrix.platform }} wheel
    needs: [validate, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-2022, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv sync --locked --no-install-project
      - name: Build a portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ needs.validate.outputs.maturin-version }}
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --interpreter python3.10 --out dist
          before-script-linux: |
            export RUSTFLAGS="--remap-path-prefix=$HOME=/build-cache --remap-path-prefix=$PWD=."
      - name: Build a native wheel
        if: runner.os != 'Linux'
        run: uv run --no-sync python scripts/build_distributions.py --out dist
      - name: Test the built wheel
        run: |
          uv pip install --python .venv --no-deps dist/*.whl
          uv run --no-sync pytest
          uv run --no-sync python scripts/verify_distribution.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    name: Build and verify the source distribution
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin sdist --out dist
      - name: Rebuild and test the source distribution in isolation
        shell: bash
        run: uv run --no-sync python scripts/verify_distribution.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  prepare:
    name: Collect verified release artifacts
    needs: [validate, wheels, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      # Download only artifacts from the builds in this workflow run.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: candidate
          merge-multiple: true
      - run: uv run --no-sync python scripts/prepare_release.py collect candidate bundle
      - uses: actions/upload-artifact@v4
        with:
          name: publication-bundle
          path: bundle/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [validate, prepare]
    if: needs.validate.outputs.release-tag != '' && (github.event_name == 'push' || inputs.release_tag != '')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ezdracad
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - uses: actions/download-artifact@v4
        with:
          name: publication-bundle
          path: bundle
      - run: uv run --no-sync python scripts/prepare_release.py verify bundle
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: bundle/dist/
          attestations: true

  github-release:
    name: Publish GitHub Release
    needs: [validate, pypi]
    if: needs.validate.outputs.release-tag != '' && (github.event_name == 'push' || inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - uses: actions/download-artifact@v4
        with:
          name: publication-bundle
          path: bundle
      - run: uv run --no-sync python scripts/prepare_release.py verify bundle
      - name: Attach distributions and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Release is already published"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" bundle/dist/* bundle/SHA256SUMS --clobber
          args=(--prerelease=false)
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            args=(--prerelease --latest=false)
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
