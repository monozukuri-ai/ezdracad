[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "ezdracad"
dynamic = ["version"]
description = "Read-only partial DRA-CAD MPZ/MPX/MPS reader with a Rust core and Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{ name = "neka-nat", email = "nekanat.stock@gmail.com" }]
dependencies = []

[project.urls]
Repository = "https://github.com/monozukuri-ai/ezdracad"
Issues = "https://github.com/monozukuri-ai/ezdracad/issues"

[project.scripts]
ezdracad = "ezdracad.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.13,<2",
    "packaging>=24",
    "pytest>=8",
    "ruff>=0.16,<0.17",
    "tomli>=2; python_version < '3.11'",
]

[tool.maturin]
manifest-path = "crates/ezdracad-python/Cargo.toml"
module-name = "ezdracad._core"
python-source = "src"
python-packages = ["ezdracad"]
include = [
    { path = "Cargo.lock", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "tests/fixtures/*", format = "sdist" },
    { path = "fuzz/Cargo.toml", format = "sdist" },
    { path = "fuzz/Cargo.lock", format = "sdist" },
    { path = "fuzz/fuzz_targets/*.rs", format = "sdist" },
    { path = "fuzz/README.md", format = "sdist" },
]
exclude = [
    ".internal/**",
    "samples/**",
    "tests/research/**",
    ".agents/**",
    ".aws/**",
    ".codex/**",
    "fuzz/target/**",
    "fuzz/artifacts/**",
    "fuzz/corpus/**",
    "fuzz/coverage/**",
]

[tool.maturin.sbom]
# Generated Rust SBOMs include absolute workspace paths.
rust = false

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = [".internal"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
